<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Janala</title>
  <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />

  <!-- Daisy UI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Font Awsome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />

  <!-- Stylesheet  -->
  <link rel="stylesheet" href="styles/style.css" />
</head>

<body>
  <!-- Header Section -->
  <header>
    <div class="navbar bg-base-100 shadow-sm">
      <div class="navbar-start">
        <div class="dropdown">
          <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
            <svg aria-label="Menu" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
            </svg>
          </div>
          <ul tabindex="-1"
            class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow gap-2">
            <a href="#"><i class="fa-solid fa-circle-question"></i>FAQ</a>
            <a href="#"><i class="fa-solid fa-book-open"></i>Learn</a>
            <a href="#"><i class="fa-solid fa-right-from-bracket"></i>LogOut</a>
          </ul>
        </div>
        <div class="flex items-center gap-1">
          <span class="font-bold text-lg">English</span>
          <img src="./assets/logo.png" alt="window-logo">
          <span class="font-bangla font-semibold text-lg">জানালা</span>
        </div>
      </div>
      <div class="navbar-end hidden lg:flex gap-2">
        <a href="#" class="btn btn-outline btn-primary"><i class="fa-solid fa-circle-question"></i>FAQ</a>
        <a href="#" class="btn btn-outline btn-primary"><i class="fa-solid fa-book-open"></i>Learn</a>
        <a href="#" class="btn btn-outline btn-primary"><i class="fa-solid fa-right-from-bracket"></i>LogOut</a>
        </ul>
      </div>
    </div>
  </header>

  <!-- Banner Section -->
  <section class="flex items-center gap-20 w-11/12 mx-auto py-5">
    <div class="flex-1">
      <span class="text-4xl font-bold text-sky-400">English</span><span class="text-4xl font-bold"> is Easy!!</span>
      <p class="my-5">আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা আপনার দক্ষতা বাড়াতে চান, আমাদের
        Interactive Lessons আপনাকে নিয়ে যাবে অন্য একটি Level এ</p>
      <div class="flex flex-col gap-2 w-1/2">
        <input class="p-2 border-gray-300 rounded-xl" type="text" placeholder="Enter Your Name">
        <input class="p-2 border-gray-300 rounded-xl" type="password" name="" id="" placeholder="password">
        <button class="btn btn-primary w-30 rounded-xl">Get Started</button>
      </div>
    </div>
    <div class="flex-1">
      <img src="./assets/hero-student.png" alt="">
    </div>
  </section>
</body>

</html>
